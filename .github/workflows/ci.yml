name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        working-directory: backend
        run: dotnet restore backend.sln

      - name: Build
        working-directory: backend
        run: dotnet build backend.sln --no-restore

      - name: Test
        working-directory: backend
        run: dotnet test backend.sln --no-build --collect:"XPlat Code Coverage"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/**/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Check
        working-directory: frontend
        run: npm run check

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        env:
          PUBLIC_API_URL: https://localhost:7086
        run: npm run build
